name: probe modern emulator cores

on:
  push:
    paths:
      - 'probes/**'
      - '.github/workflows/probe-modern.yml'
      - 'MODERN_CORE_PROBES.md'
  pull_request:
    paths:
      - 'probes/**'
      - '.github/workflows/probe-modern.yml'
      - 'MODERN_CORE_PROBES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gecko-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build pinned Gecko browser target
        run: bash probes/gecko-web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: probe-gecko-web
          path: build/gecko-web/*
          if-no-files-found: error
